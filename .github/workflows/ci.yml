
name: ResourceHub CI Pipeline

on:
  push:
    branches: [feature/QA, qa-reservation-testing]
  pull_request:
    branches: [feature/QA]
jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    env:
      MONGO_URI: mongodb://127.0.0.1:27017/resourcehub_dev
      MONGO_URI_TEST: mongodb://127.0.0.1:27017/resourcehub_test
      JWT_SECRET: github-actions-test-secret

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run API tests
        run: npm test

      - name: Run unit tests
        run: node --test tests/reservationTimer.test.js

      - name: Run BDD tests
        run: npm run bdd
